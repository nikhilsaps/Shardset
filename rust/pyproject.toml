[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "shardset-engine"
version = "0.1.0"
description = "Shardset image reproduction engine (Rust core) for Python."
requires-python = ">=3.9"

[tool.maturin]
features = ["pyo3/extension-module"]
module-name = "shardset_engine"
