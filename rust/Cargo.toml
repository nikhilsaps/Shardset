[package]
name = "shardset_engine"
version = "0.1.0"
edition = "2021"
description = "Shardset: reproduce an image with geometric shards. Rust core (multicore) exposed to Python via PyO3."

[lib]
name = "shardset_engine"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
rand = { version = "0.8", features = ["small_rng"] }
rand_distr = "0.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
